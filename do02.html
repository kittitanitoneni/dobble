<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iPad és PWA támogatás -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Márton-napi Dobble</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none; /* Megakadályozza a véletlen görgetést/nagyítást iPaden */
            transition: background-color 1s ease; /* Finom átmenet a háttérszín váltásakor */
        }
        
        .dobble-card {
            border-radius: 50%;
            background-color: white;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            aspect-ratio: 1 / 1;
            /* Extra biztonság, hogy semmi ne lógjon ki a körből */
            overflow: hidden; 
        }

        .symbol-container {
            position: absolute;
            transform-origin: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .symbol-container:hover {
            transform: scale(1.1) !important;
        }

        .symbol-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garantálja, hogy a kép nem torzul és belefér a dobozába */
            pointer-events: none; /* Hogy a kattintást a container kapja */
        }

        .symbol-emoji {
            /* Ha mégis emojit használunk, az kitölti a dobozt */
            font-size: 100%;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Sikeres találat animáció - Nincs háttérszín váltás, marad hófehér! */
        @keyframes correctMatch {
            0% { transform: scale(1); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px 10px rgba(253, 224, 71, 0.8); }
            100% { transform: scale(1); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        }

        .animate-correct {
            animation: correctMatch 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-orange-50 h-screen w-screen overflow-hidden flex items-center justify-center font-sans text-gray-800 select-none">

    <!-- Kezdőképernyő -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-orange-50/95 backdrop-blur-sm">
        <h1 class="text-6xl font-bold mb-8 text-orange-600 drop-shadow-md">Márton-napi Dobble</h1>
        
        <div class="bg-white p-8 rounded-3xl shadow-xl flex flex-col gap-6 text-2xl w-[500px]">
            
            <!-- Játékmód választó -->
            <div class="flex flex-col gap-2">
                <label class="font-bold text-gray-700">Játékmód:</label>
                <div class="flex gap-4">
                    <button id="mode-time-btn" class="flex-1 py-3 bg-orange-500 text-white rounded-xl font-bold shadow-md opacity-100 transition-opacity" onclick="setMode('time')">Időre</button>
                    <button id="mode-pairs-btn" class="flex-1 py-3 bg-gray-300 text-gray-700 rounded-xl font-bold shadow-md opacity-70 transition-opacity" onclick="setMode('pairs')">Párokra</button>
                </div>
            </div>

            <!-- Idő / Cél beállító -->
            <div class="flex flex-col gap-2">
                <label id="value-label" class="font-bold text-gray-700">Játékidő:</label>
                <select id="game-value" class="w-full p-4 border-2 border-orange-200 rounded-xl bg-orange-50 outline-none text-2xl">
                    <option value="60">1 perc</option>
                    <option value="120">2 perc</option>
                    <option value="180">3 perc</option>
                    <option value="300">5 perc</option>
                </select>
            </div>

            <!-- Ikonok száma -->
            <div class="flex flex-col gap-2">
                <label class="font-bold text-gray-700">Ikonok száma (nehézség):</label>
                <select id="symbol-count" class="w-full p-4 border-2 border-orange-200 rounded-xl bg-orange-50 outline-none text-2xl">
                    <option value="3">3 ikon (Nagyon könnyű)</option>
                    <option value="4">4 ikon (Könnyű)</option>
                    <option value="6" selected>6 ikon (Közepes)</option>
                    <option value="8">8 ikon (Nehéz - 57 kép kell)</option>
                </select>
            </div>

            <button id="start-btn" onclick="initAndStartGame()" class="mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-5 px-8 rounded-2xl shadow-lg transition-transform transform hover:scale-105 text-3xl" disabled>
                Betöltés...
            </button>
        </div>
    </div>

    <!-- Játéktér (Fektetett iPadre optimalizálva) -->
    <div id="game-screen" class="hidden w-full h-full flex flex-row items-center justify-between p-4 gap-4">
        
        <!-- Bal kártya -->
        <div id="card1" class="dobble-card flex-1 max-w-[45%]"></div>

        <!-- Középső UI (Újraindítás gombként is funkcionál) -->
        <div class="flex flex-col items-center justify-center gap-10 w-[10%] h-full cursor-pointer transition-transform hover:scale-110" onclick="showStartScreen()" title="Kattints az újraindításhoz!">
            
            <div class="flex flex-col items-center">
                <span id="time-display" class="text-5xl font-black text-orange-600 drop-shadow-sm">01:00</span>
            </div>

            <div class="flex flex-col items-center">
                <span id="score-display" class="text-6xl font-black text-green-600 drop-shadow-sm">0</span>
            </div>

        </div>

        <!-- Jobb kártya -->
        <div id="card2" class="dobble-card flex-1 max-w-[45%]"></div>

    </div>

    <script>
        // Beállítások és Állapotok
        const JSON_URL = 'https://kittitanitoneni.github.io/dobble/pic02.json';
        const BASE_IMG_URL = 'https://kittitanitoneni.github.io/dobble/';
        
        let IMAGES = [];
        let SYMBOL_ANGLES = {};
        let SYMBOL_TRANSLATIONS = {};

        // Fallback (ha a JSON nem töltődne be)
        const FALLBACK_EMOJIS = ["🦆","🦢","🏮","🕯️","🏇","🧥","⚔️","🛡️","⛪","🔥","🍂","🍁","🌰","🎃","🍇","🍷","🍗","🥖","🌧️","☔","🧣","🧤","👢","🌙","⭐","☁️","🌾","🌻","🧺","🍎","🍏","🍐","🧅","🥨","🧀","🍲","🏕️","👑","📿","🦔","🦊","🦉","🐎","🦅","🌲","🌳","🪓","🍯","🏺","🕰️","🔔","🎶","🤝","👨‍🦯","🐴","🍷","🥧"];

        let gameMode = 'time'; // 'time' vagy 'pairs'
        let gameValue = 60;
        let timeLeft = 60;
        let score = 0;
        let timerInterval;
        
        let deck = [];
        let gameSequence = [];
        let currentSequenceIndex = 0;
        
        let currentCard1 = [];
        let currentCard2 = [];
        let isAnimating = false;
        
        let audioInitialized = false;

        // Háttérszínek a ciklusok jelzéséhez
        const BG_COLORS = ['bg-orange-50', 'bg-blue-50', 'bg-green-50', 'bg-purple-50', 'bg-yellow-50', 'bg-pink-50'];
        let currentBgIndex = 0;

        // Elemek
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const timeDisplay = document.getElementById('time-display');
        const scoreDisplay = document.getElementById('score-display');
        const card1El = document.getElementById('card1');
        const card2El = document.getElementById('card2');
        const startBtn = document.getElementById('start-btn');
        
        // JSON Betöltése
        async function loadImagesData() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                IMAGES = [];
                SYMBOL_ANGLES = {};
                SYMBOL_TRANSLATIONS = {};

                data.forEach(item => {
                    let symbolRef;
                    if (item.pic) {
                        symbolRef = BASE_IMG_URL + item.pic;
                        IMAGES.push(symbolRef);
                    } else if (item.emoji) {
                        symbolRef = item.emoji;
                        IMAGES.push(symbolRef);
                    }

                    if (symbolRef && item.maxangle !== undefined) {
                        SYMBOL_ANGLES[symbolRef] = parseInt(item.maxangle);
                    }

                    if (symbolRef && (item.hu || item.en)) {
                        SYMBOL_TRANSLATIONS[symbolRef] = {
                            hu: item.hu,
                            en: item.en
                        };
                    }
                });

                startBtn.textContent = "Játék Indítása";
                startBtn.disabled = false;
            } catch (error) {
                console.warn("Nem sikerült betölteni a JSON-t, visszaállás emojikra.", error);
                IMAGES = [...FALLBACK_EMOJIS];
                startBtn.textContent = "Játék Indítása (Alapértelmezett)";
                startBtn.disabled = false;
            }
        }

        window.onload = loadImagesData;

        function setMode(mode) {
            gameMode = mode;
            const timeBtn = document.getElementById('mode-time-btn');
            const pairsBtn = document.getElementById('mode-pairs-btn');
            const valueLabel = document.getElementById('value-label');
            const selectEl = document.getElementById('game-value');

            if (mode === 'time') {
                timeBtn.classList.replace('opacity-70', 'opacity-100');
                pairsBtn.classList.replace('opacity-100', 'opacity-70');
                timeBtn.classList.replace('bg-gray-300', 'bg-orange-500');
                pairsBtn.classList.replace('bg-orange-500', 'bg-gray-300');
                
                valueLabel.textContent = "Játékidő:";
                selectEl.innerHTML = `
                    <option value="60">1 perc</option>
                    <option value="120">2 perc</option>
                    <option value="180">3 perc</option>
                    <option value="300">5 perc</option>
                `;
            } else {
                pairsBtn.classList.replace('opacity-70', 'opacity-100');
                timeBtn.classList.replace('opacity-100', 'opacity-70');
                pairsBtn.classList.replace('bg-gray-300', 'bg-orange-500');
                timeBtn.classList.replace('bg-orange-500', 'bg-gray-300');
                
                valueLabel.textContent = "Cél (megtalálandó párok):";
                selectEl.innerHTML = `
                    <option value="10">10 pár</option>
                    <option value="20">20 pár</option>
                    <option value="31">31 pár</option>
                    <option value="50">50 pár</option>
                `;
            }
        }

        function isPrime(num) {
            for(let i = 2, s = Math.sqrt(num); i <= s; i++)
                if(num % i === 0) return false; 
            return num > 1;
        }

        function generateProjectivePlane(n) {
            let cards = [];
            
            // 1. kártya (középpont)
            let card1 = [];
            for (let i = 0; i <= n; i++) {
                card1.push(i);
            }
            cards.push(card1);

            // n kártya (vízszintes vonalak)
            for (let j = 0; j < n; j++) {
                let card = [0];
                for (let k = 0; k < n; k++) {
                    card.push(n + 1 + j * n + k);
                }
                cards.push(card);
            }

            // n*n kártya (többi vonal)
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    let card = [i + 1];
                    for (let k = 0; k < n; k++) {
                        let val = n + 1 + k * n + ((i * k + j) % n);
                        card.push(val);
                    }
                    cards.push(card);
                }
            }
            return cards;
        }

        function getRequiredSymbols(k) {
            return (k * k) - k + 1;
        }

        // Gráfelméleti sorsolás: Minden lehetséges pár sorra kerül
        function generateGameSequence(cards) {
            let sequence = [];
            let unvisitedCards = [...cards];
            let usedSymbols = new Set();
            
            let currentCard = unvisitedCards.splice(Math.floor(Math.random() * unvisitedCards.length), 1)[0];
            
            while (unvisitedCards.length > 0) {
                let nextCardIndex = -1;
                let validSymbol = -1;

                for (let i = 0; i < unvisitedCards.length; i++) {
                    let match = currentCard.find(sym => unvisitedCards[i].includes(sym));
                    if (!usedSymbols.has(match)) {
                        nextCardIndex = i;
                        validSymbol = match;
                        break;
                    }
                }

                if (nextCardIndex === -1) {
                    usedSymbols.clear();
                    nextCardIndex = Math.floor(Math.random() * unvisitedCards.length);
                } else {
                    usedSymbols.add(validSymbol);
                }

                let nextCard = unvisitedCards.splice(nextCardIndex, 1)[0];
                sequence.push({ card1: currentCard, card2: nextCard });
                currentCard = nextCard;
            }
            
            // Ne legyen egyértelmű az első pár, ha újrakezdődik a ciklus
            sequence.sort(() => Math.random() - 0.5); 
            return sequence;
        }

        function initAudioContext() {
            if (!audioInitialized && 'speechSynthesis' in window) {
                // Üres hang lejátszása a feloldáshoz
                let u = new SpeechSynthesisUtterance("");
                u.volume = 0;
                window.speechSynthesis.speak(u);
                audioInitialized = true;
            }
        }

        function initAndStartGame() {
            initAudioContext();
            
            const k = parseInt(document.getElementById('symbol-count').value);
            const n = k - 1;
            
            if (!isPrime(n)) {
                alert("Hiba: Az n értéknek prímnek kell lennie!");
                return;
            }

            const reqSymbols = getRequiredSymbols(k);
            
            if (IMAGES.length < reqSymbols) {
                alert(`Ehhez a szinthez legalább ${reqSymbols} kép/emoji szükséges a JSON-ben! Jelenleg ${IMAGES.length} db van.`);
                return;
            }

            // Csak annyi képet vágunk le a listából, amennyi a nehézséghez kell
            let selectedImages = IMAGES.slice(0, reqSymbols);
            
            let numCards = generateProjectivePlane(n);
            deck = numCards.map(cardIndexes => cardIndexes.map(i => selectedImages[i]));
            
            gameValue = parseInt(document.getElementById('game-value').value);
            
            startGame();
        }

        function startGame() {
            score = 0;
            currentSequenceIndex = 0;
            currentBgIndex = 0;
            document.body.className = `${BG_COLORS[currentBgIndex]} h-screen w-screen overflow-hidden flex items-center justify-center font-sans text-gray-800 select-none`;
            
            gameSequence = generateGameSequence(deck);
            scoreDisplay.textContent = score;

            if (gameMode === 'time') {
                timeLeft = gameValue;
                updateTimeDisplay(timeLeft);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimeDisplay(timeLeft);
                    if (timeLeft <= 0) endGame();
                }, 1000);
            } else {
                timeLeft = 0;
                updateTimeDisplay(timeLeft);
                timerInterval = setInterval(() => {
                    timeLeft++;
                    updateTimeDisplay(timeLeft);
                }, 1000);
            }

            startScreen.classList.add('hidden');
            gameScreen.classList.replace('hidden', 'flex');
            
            nextRound();
        }

        function updateTimeDisplay(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${m}:${s}`;
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            if (m > 0) return `${m} perc ${s} mp`;
            return `${s} mp`;
        }

        function showStartScreen() {
            clearInterval(timerInterval);
            gameScreen.classList.replace('flex', 'hidden');
            startScreen.classList.remove('hidden');
        }

        function endGame() {
            clearInterval(timerInterval);
            let msg = gameMode === 'time' 
                ? `Lejárt az idő! Összesen ${score} párt találtál meg.`
                : `Gratulálok! Megtaláltad a ${gameValue} párt ${formatTime(timeLeft)} alatt!`;
            
            setTimeout(() => {
                alert(msg);
                showStartScreen();
            }, 100);
        }

        // Négyzetes dobozok és sugaras elrendezés (Szigorúan elszeparálva)
        function getPositions(count) {
            const positions = [];
            // (x, y %-ban a kártya közepéhez képest, size %-ban a kártya szélességéhez képest)
            if (count === 3) {
                // Háromszög
                for(let i=0; i<3; i++) {
                   const angle = i * (Math.PI * 2 / 3);
                   positions.push({ x: 50 + 25 * Math.cos(angle), y: 50 + 25 * Math.sin(angle), size: 30 });
                }
            } else if (count === 4) {
                // Négyzet
                for(let i=0; i<4; i++) {
                   const angle = i * (Math.PI * 2 / 4) + Math.PI/4;
                   positions.push({ x: 50 + 25 * Math.cos(angle), y: 50 + 25 * Math.sin(angle), size: 28 });
                }
            } else if (count === 6) {
                // 1 középen, 5 körülötte
                positions.push({ x: 50, y: 50, size: 28 }); // Center
                for(let i=0; i<5; i++) {
                   const angle = i * (Math.PI * 2 / 5);
                   positions.push({ x: 50 + 32 * Math.cos(angle), y: 50 + 32 * Math.sin(angle), size: 24 });
                }
            } else if (count === 8) {
                // 1 középen, 7 körülötte
                positions.push({ x: 50, y: 50, size: 26 }); // Center
                for(let i=0; i<7; i++) {
                   const angle = i * (Math.PI * 2 / 7);
                   positions.push({ x: 50 + 34 * Math.cos(angle), y: 50 + 34 * Math.sin(angle), size: 20 });
                }
            }
            return positions;
        }

        function drawCard(cardEl, cardData, cardId) {
            cardEl.innerHTML = '';
            
            // Keverjük össze a képeket, hogy ne a közepén legyen mindig a közös
            let shuffledSymbols = [...cardData].sort(() => Math.random() - 0.5);
            let positions = getPositions(shuffledSymbols.length);
            
            // Keverjük össze a pozíciókat is egy picit
            positions.sort(() => Math.random() - 0.5);

            shuffledSymbols.forEach((sym, index) => {
                const pos = positions[index];
                
                // Maxangle figyelembe vétele
                let maxA = SYMBOL_ANGLES[sym];
                if (maxA === undefined) maxA = 180; // Ha nincs megadva, 180 (teljesen körbe)
                let rot = (Math.random() * maxA * 2) - maxA;

                const wrapper = document.createElement('div');
                wrapper.className = 'symbol-container';
                
                // Középpontos pozicionálás, és fix négyzet alakú kiterjedés (size x size)
                wrapper.style.left = `${pos.x}%`;
                wrapper.style.top = `${pos.y}%`;
                wrapper.style.width = `${pos.size}%`;
                wrapper.style.height = `${pos.size}%`;
                // Eltoljuk a felével, hogy pontosan a koordinátán legyen a közepe
                wrapper.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
                
                wrapper.onclick = () => handleSymbolClick(sym, cardId);

                if (sym.startsWith('http') || sym.endsWith('.png') || sym.endsWith('.jpg')) {
                    const img = document.createElement('img');
                    img.src = sym;
                    img.className = 'symbol-img';
                    img.draggable = false;
                    wrapper.appendChild(img);
                } else {
                    const emj = document.createElement('div');
                    emj.className = 'symbol-emoji';
                    emj.innerText = sym;
                    // A betűméret alkalmazkodik a konténer magasságához
                    emj.style.fontSize = `min(100%, ${cardEl.clientWidth * (pos.size/100)}px)`;
                    wrapper.appendChild(emj);
                }

                cardEl.appendChild(wrapper);
            });
        }

        function speakText(text, lang, onEnd) {
            if (!('speechSynthesis' in window)) {
                if (onEnd) onEnd();
                return;
            }
            
            window.speechSynthesis.cancel(); 
            
            let speechFinished = false;
            let fallbackTimer;

            const finish = () => {
                if (!speechFinished) {
                    speechFinished = true;
                    clearTimeout(fallbackTimer);
                    if (onEnd) onEnd();
                }
            };

            // Pici késleltetés a hangmotor biztonságos átváltásához
            setTimeout(() => {
                // Láthatatlan szóköz a szó elejének elharapása ellen
                const utterance = new SpeechSynthesisUtterance(" " + text);
                utterance.lang = lang;
                utterance.rate = 0.85; 
                
                utterance.onend = finish;
                utterance.onerror = finish;

                // Max 3.5 sec várakozás
                fallbackTimer = setTimeout(finish, 3500);

                window.speechSynthesis.speak(utterance);
            }, 100);
        }

        function handleSymbolClick(clickedSymbol, cardId) {
            if (isAnimating || (gameMode === 'time' && timeLeft <= 0)) return;

            const match = currentCard1.find(sym => currentCard2.includes(sym));
            const translations = SYMBOL_TRANSLATIONS[clickedSymbol];

            if (clickedSymbol === match) {
                isAnimating = true;
                score++;
                scoreDisplay.textContent = score;

                card1El.classList.add('animate-correct');
                card2El.classList.add('animate-correct');

                // Ha Párokra játsszunk, ellenőrizzük a célt
                if (gameMode === 'pairs' && score >= gameValue) {
                    setTimeout(endGame, 500);
                    return;
                }

                if (translations && translations.hu && translations.en) {
                    speakText(translations.hu, 'hu-HU', () => {
                        // Természetes szünet (0.3mp) a két nyelv között
                        setTimeout(() => {
                            speakText(translations.en, 'en-US', finishCorrectMatch);
                        }, 300);
                    });
                } else {
                    setTimeout(finishCorrectMatch, 400); 
                }
            } else {
                // Hibás kattintás esetén (Bal kártya: HU, Jobb kártya: EN)
                if (translations) {
                    isAnimating = true;
                    if (cardId === 'card1' && translations.hu) {
                        speakText(translations.hu, 'hu-HU', () => { isAnimating = false; });
                    } else if (cardId === 'card2' && translations.en) {
                        speakText(translations.en, 'en-US', () => { isAnimating = false; });
                    } else {
                        isAnimating = false;
                    }
                }
            }
        }

        function finishCorrectMatch() {
            card1El.classList.remove('animate-correct');
            card2El.classList.remove('animate-correct');
            nextRound();
        }

        function nextRound() {
            if (currentSequenceIndex >= gameSequence.length) {
                // Ha végigértünk az összes kártyán, újrageneráljuk és háttérszínt váltunk!
                gameSequence = generateGameSequence(deck);
                currentSequenceIndex = 0;
                
                currentBgIndex = (currentBgIndex + 1) % BG_COLORS.length;
                document.body.className = `${BG_COLORS[currentBgIndex]} h-screen w-screen overflow-hidden flex items-center justify-center font-sans text-gray-800 select-none`;
            }

            currentCard1 = gameSequence[currentSequenceIndex].card1;
            currentCard2 = gameSequence[currentSequenceIndex].card2;
            currentSequenceIndex++;

            drawCard(card1El, currentCard1, 'card1');
            drawCard(card2El, currentCard2, 'card2');
            
            isAnimating = false;
        }

    </script>
</body>
</html>
